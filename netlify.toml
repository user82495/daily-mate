# Daily Mate on Netlify.
#
# The game is still exactly what is in the repository — no build step, publish
# the root. The functions exist only for analytics: they hold the Supabase
# credentials and the dashboard key so that neither ever reaches a browser.

[build]
  publish = "."
  functions = "netlify/functions"

# The local-only dashboard must never be served. It is gitignored, so a normal
# git-triggered build never sees it — but `netlify deploy` from the CLI uploads
# the working directory including untracked files, and that folder holds the
# service role key. This rule makes the path 404 regardless of how it got here.
# It is listed first so nothing later can shadow it.
[[redirects]]
  from = "/local-dashboard/*"
  to = "/index.html"
  status = 404

# /api/track, /api/day-stats, /api/dashboard-data
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# The dashboard shell carries no data, but there is no reason for it to be in
# an index either.
[[headers]]
  for = "/dashboard.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
